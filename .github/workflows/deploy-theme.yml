name: Deploy Keycloak Theme

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy theme to VPS and Keycloak container
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
              set -e

              echo "🧹 Limpando pasta tema-keycloak"
              rm -rf ~/tema-keycloak
              mkdir -p ~/tema-keycloak

              echo "⬇️ Clonando branch main"
              cd ~
              git clone -b main https://github.com/luanmario/keycloak-custom-theme.git tema-keycloak

              echo "📦 Copiando tema para container do Keycloak"
              docker cp \
                ~/tema-keycloak/themes/dexcode \
                ${{ secrets.KEYCLOAK_CONTAINER }}:/opt/keycloak/themes

              echo "🔐 Ajustando permissões"
              docker exec -u 0 ${{ secrets.KEYCLOAK_CONTAINER }} \
                chown -R 1000:1000 /opt/keycloak/themes/dexcode

              echo "♻️ Reiniciando Keycloak"
              docker restart ${{ secrets.KEYCLOAK_CONTAINER }}

              echo "✅ Deploy finalizado com sucesso"
          EOF